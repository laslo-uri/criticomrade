<button
  type="button"
  class="logo"
  [class.logo--nav]="variant() === 'nav'"
  [class.logo--hero]="variant() === 'hero'"
  (click)="openAbout()"
  [attr.aria-label]="'brand.aboutAria' | translate"
>
  <span class="logo-mark-wrap" aria-hidden="true">
    <svg class="logo-mark-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Gold back bubble -->
      <rect x="2" y="16" width="24" height="20" rx="4" fill="#E8A838"/>
      <polygon points="8,36 6,44 16,36" fill="#E8A838"/>
      <!-- Red front bubble -->
      <rect x="14" y="4" width="30" height="26" rx="5" fill="#C42332"/>
      <polygon points="36,30 40,38 28,30" fill="#C42332"/>
      <!-- White star -->
      <polygon points="29,10 31.1,16.5 38,16.5 32.5,20.5 34.5,27 29,23 23.5,27 25.5,20.5 20,16.5 26.9,16.5" fill="white"/>
    </svg>
  </span>
  <span class="logo-body">
    <span class="logo-text">
      <span class="logo-criti">Criti</span><span class="logo-comrade">comrade</span>
    </span>
    @if (variant() === 'hero') {
      <span class="logo-tagline">{{ 'brand.tagline' | translate }}</span>
    }
  </span>
</button>

<app-about-modal [open]="aboutOpen()" (closed)="aboutOpen.set(false)" />
