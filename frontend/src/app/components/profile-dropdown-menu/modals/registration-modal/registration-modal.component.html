<div #registrationModal class="container">
  <div class="blocker" (click)="close()"></div>
  <div class="content">
    <div class="row">
      <section class="section">
        <header>
          <h3>Sign up</h3>
          <h4>Please fill your information bellow</h4>
        </header>
        <main>
          <form id="regForm" animate [formGroup]="registerForm">
            <div class="form-item box-item">
              <input
                type="text"
                name="name"
                placeholder="Name"
                [(ngModel)]="name"
                formControlName="name"
                data-required
              />
              <small class="errorReq" name="nameError"
                ><i class="fa fa-asterisk" aria-hidden="true"></i> required
                field</small
              >
            </div>

            <div class="form-item box-item">
              <input
                type="text"
                name="username"
                placeholder="Username"
                [(ngModel)]="username"
                formControlName="username"
                data-required
              />
              <small class="errorReq" name="usernameError"
                ><i class="fa fa-asterisk" aria-hidden="true"></i> required
                field</small
              >
            </div>

            <div class="form-item box-item">
              <input
                type="email"
                name="email"
                placeholder="Email"
                [(ngModel)]="email"
                formControlName="email"
                data-email
                data-required
              />
              <small class="errorReq" name="emailError"
                ><i class="fa fa-asterisk" aria-hidden="true"></i> required
                field</small
              >
              <small class="errorEmail"
                ><i class="fa fa-asterisk" aria-hidden="true"></i> email is not
                valid</small
              >
            </div>

            <div class="form-item box-item">
              <input
                type="password"
                name="password"
                placeholder="Password"
                data-email
                data-required
              />
              <small class="errorReq"
                ><i class="fa fa-asterisk" aria-hidden="true"></i> required
                field</small
              >
              <small class="errorEmail"
                ><i class="fa fa-asterisk" aria-hidden="true"></i> password is
                not valid</small
              >
            </div>

            <div class="form-item box-item">
              <input
                type="password"
                name="repeatPassword"
                placeholder="Repeat Password"
                data-email
                data-required
              />
              <small class="errorReq"
                ><i class="fa fa-asterisk" aria-hidden="true"></i> required
                field</small
              >
              <small class="errorEmail"
                ><i class="fa fa-asterisk" aria-hidden="true"></i> password is
                not valid</small
              >
            </div>

            <div class="form-item">
              <span id="submit" class="submit" (click)="close()">Submit</span>
            </div>
          </form>
        </main>
        <footer>
          <p>Already have an account? <a>Login here</a></p>
        </footer>
        <i class="wave"></i>
      </section>
    </div>
  </div>
</div>
