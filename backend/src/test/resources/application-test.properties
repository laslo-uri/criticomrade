spring.datasource.url=jdbc:h2:mem:criticomrade-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.sql.init.mode=never
spring.flyway.enabled=false

criticomrade.jwt.secret=test-secret-key-for-unit-tests-minimum-256-bits-long-enough
criticomrade.jwt.expiration-ms=3600000
criticomrade.cors.allowed-origins=http://localhost:4200
criticomrade.tmdb.api-key=test-key
criticomrade.tmdb.base-url=https://api.themoviedb.org/3
