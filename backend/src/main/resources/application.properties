spring.application.name=CritiComrade
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/criticomrade}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

criticomrade.jwt.secret=${JWT_SECRET:change-me-in-production-use-long-random-string}
criticomrade.jwt.expiration-ms=${JWT_EXPIRATION_MS:43200000}
criticomrade.jwt.remember-expiration-ms=${JWT_REMEMBER_EXPIRATION_MS:2592000000}
criticomrade.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

criticomrade.tmdb.api-key=${TMDB_API_KEY:}
criticomrade.tmdb.base-url=https://api.themoviedb.org/3
criticomrade.omdb.api-key=${OMDB_API_KEY:}
criticomrade.omdb.base-url=https://www.omdbapi.com

criticomrade.mail.host=${MAIL_HOST:}
criticomrade.mail.port=${MAIL_PORT:587}
criticomrade.mail.username=${MAIL_USERNAME:}
criticomrade.mail.password=${MAIL_PASSWORD:}
criticomrade.mail.from=${MAIL_FROM:noreply@criticomrade.app}

criticomrade.password-reset.expiry-minutes=${PASSWORD_RESET_EXPIRY_MINUTES:15}
criticomrade.password-reset.max-requests-per-hour=${PASSWORD_RESET_MAX_REQUESTS_PER_HOUR:3}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
